; Presets por modelo del router de llama-server (--models-preset). Lo crea
; Growi Bridge; puedes editarlo: una seccion que ya existe no se pisa.
; Claves = flags largos sin '--'. -np 1: una tarea a la vez y el contexto
; entero (-c) para ella; si subes np, -c se reparte entre los slots.
version = 1

[*]
n-gpu-layers = 99
parallel = 1

[hermes-3-8b-q4_k_m]
; Hermes 3 8B (Q4_K_M, 4,9 GB): 33/33 capas en la RTX 3060 6 GB, 5551 MiB a 8k.
; No subir de 8192 en 6 GB (16k = 6575 MiB, no cabe).
ctx-size = 8192
parallel = 1
n-gpu-layers = 99
